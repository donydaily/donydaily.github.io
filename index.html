<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DONYDAILY</title>
    
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>

    <div class="profile-container">
        <!-- Top Floating Pill Navbar -->
        <nav class="top-nav">
            <a href="#" class="nav-item active" data-target="page-home"><i class="fas fa-home"></i> Home</a>
            <a href="#" class="nav-item" data-target="page-editor"><i class="fas fa-code"></i> Editor</a>
            <a href="#" class="nav-item" data-target="page-music"><i class="fas fa-music"></i> Music</a>
        </nav>
        
      <!-- ================= HALAMAN 1: HOME ================= -->
      <div id="page-home" class="page-section active">
        <!-- Bio Typing Effect -->
        <div class="bio-container">
            <p class="bio-typing">
                <span id="typing-text"></span><span class="cursor">|</span>
            </p>
        </div>
        
        <!-- Live Clock Widget -->
        <div class="clock-widget">
            <i class="fas fa-clock"></i>
            <span id="live-clock">--:--:-- WIB</span>
        </div>

        <!-- Mini Playlist Music Player -->

            <div class="player-main">
                <img id="album-art" class="album-art" src="" alt="Album Art">
                
                <div class="player-details">
                    <div class="track-text">
                        <span id="audio-title" class="track-title">Loading track...</span>
                        <span id="audio-artist" class="track-artist">Artist</span>
                    </div>
                    
                    <div class="player-controls">
                        <button id="prev-btn" class="ctrl-btn" title="Previous Song"><i class="fas fa-step-backward"></i></button>
                        <button id="play-btn" class="play-btn" title="Play/Pause"><i id="play-icon" class="fas fa-play"></i></button>
                        <button id="next-btn" class="ctrl-btn" title="Next Song"><i class="fas fa-step-forward"></i></button>
                        <button id="playlist-btn" class="ctrl-btn" title="Tracklist"><i class="fas fa-list-ul"></i></button>
                    </div>
                </div>
            </div>

            <div id="progress-container" class="progress-container">

            <div id="playlist-container" class="playlist-container"></div>
            
            <audio id="audio-player" preload="metadata"></audio>
        </div-->

        <!-- Links -->
        <div class="links-flex">
            <!-- Group GitHub Repo Dropdown -->
            <div class="repo-group">
                <div class="btn-link" id="repo-btn">
                    <div class="btn-link-content">
                        <i class="fab fa-github"></i>
                        <span>GitHub Repositories</span>
                    </div>
                    <i class="fas fa-chevron-down arrow" id="repo-arrow"></i>
                </div>
                
                <div id="repo-container" class="repo-container">
                    <div class="search-box-wrapper" id="search-box-wrapper" style="display: none;">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="repo-search" placeholder="Search repositories..." autocomplete="off">
                    </div>
                    <div id="repo-list"></div>
                </div>
            </div>
            
            <a href="https://t.me/donydaily" target="_blank" class="btn-link">
                <div class="btn-link-content">
                    <i class="fab fa-telegram"></i>
                    <span>Telegram Channel</span>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>

            <a href="mailto:ubuntudonydaily@gmail.com" class="btn-link">
                <div class="btn-link-content">
                    <i class="fas fa-envelope"></i>
                    <span>Contact Me</span>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>
            <!-- Baris Ikon Media Sosial -->
            <div class="social-links">
                <a href="https://github.com/donydaily" target="_blank" class="social-icon" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://t.me/donydaily" target="_blank" class="social-icon" title="Telegram">
                    <i class="fab fa-telegram"></i>
                </a>
                <a href="https://x.com/from_a_doni" target="_blank" class="social-icon" title="X (Twitter)">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="https://instagram.com/from_a_doni" target="_blank" class="social-icon" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://facebook.com/fromdonii" target="_blank" class="social-icon" title="Facebook">
                    <i class="fab fa-facebook"></i>
                </a>
            </div>
        </div>
        
        <!-- Tech Stack -->
        <div class="tags-title">Current Tech Stack</div>
        <div class="tags-container">
            <span class="tag">Python</span>
            <span class="tag">HTML/CSS</span>
            <span class="tag">javaScript</span>
            <span class="tag">Bash</span>
            <span class="tag">Php</span>
        </div>
      </div>
        
      <!-- ================= HALAMAN 2: TEXT EDITOR ================= -->
      <div id="page-editor" class="page-section" style="display: none;">
          <div class="editor-wrapper">
              <div class="editor-header">
                  <span class="editor-title"><i class="fas fa-file-code"></i> scratchpad.txt</span>
                  <button id="copy-editor-btn" class="editor-btn"><i class="fas fa-copy"></i> Copy</button>
              </div>
              <textarea id="editor-textarea" placeholder="// Type notes, quizzes, or code drafts here... (Automatically saved)"></textarea>
          </div>
      </div>

      <!-- ================= HALAMAN 3: MUSIC PLAYER ================= -->
      <div id="page-music" class="page-section" style="display: none;">
        <div class="music-card-full">
            <div class="vinyl-wrapper">
                <img id="full-player-cover" src="https://i.scdn.co/image/ab67616d0000b2737603c407817088f115594b2f" alt="Cover" class="vinyl-record">
            </div>

            <div class="track-details">
                <h3 id="full-track-title">2002</h3>
                <p id="full-track-artist">Anne Marie</p>
            </div>

            <!-- Progress Bar -->
            <div class="progress-box">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100">
                <span id="total-duration">0:00</span>
            </div>

            <!-- Playback Controls -->
            <div class="player-controls">
                <button id="prev-btn" class="ctrl-btn"><i class="fas fa-step-backward"></i></button>
                <button id="main-play-btn" class="ctrl-btn play-btn"><i class="fas fa-play" id="main-play-icon"></i></button>
                <button id="next-btn" class="ctrl-btn"><i class="fas fa-step-forward"></i></button>
                <button id="playlist-toggle-btn" class="ctrl-btn" title="Playlist"><i class="fas fa-list"></i></button>
            </div>

            <!-- Playlist Drawer -->
            <div id="playlist-container" class="playlist-container" style="display: none;">
                <ul id="playlist-items" class="playlist-items"></ul>
            </div>
        </div>
      </div>
        
        <!-- Copyright Footer -->
        <footer class="footer">
            <p>&copy; <span id="year"></span> donydaily. All rights reserved.</p>
        </footer>
    </div>

    <!-- Link ke File JS External -->
    <script src="script.js"></script>
